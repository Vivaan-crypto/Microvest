# === CONFIG ===
# One location to tweak *everything* (no magic numbers in code).
model:
  seq_len: 30               # how many past days we feed the net
  hidden: 128               # LSTM hidden units
  layers: 3                 # stacked LSTM layers
  dropout: 0.3
  heads: 4                  # multi-head attention
  lr: 1e-3                  # Adam learning-rate

data:
  tickers: [
        'AAPL', 'MSFT', 'AMZN', 'GOOGL', 'META', 'NVDA', 'AMD', 'NFLX', 'TSLA', 'AVGO',
        'COST', 'LLY', 'JPM', 'V', 'MA', 'UNH', 'HD', 'KO', 'PEP', 'MCD',
        'CRM', 'ORCL', 'INTC', 'CSCO', 'QCOM', 'TSM', 'ADP', 'PANW', 'SHOP',
        'NKE', 'SBUX', 'CAT', 'BA', 'GE', 'LMT', 'RTX', 'DE', 'HON', 'MMM',
        'BABA', 'TTD', 'PLTR', 'MU', 'INTU', 'SNOW', 'MDB', 'NOW', 'UBER', 'LYFT',
        'GS', 'MS', 'BAC', 'WFC', 'SCHW', 'BLK', 'BX', 'CME', 'ICE', 'PYPL',
        'UNP', 'CSX', 'NSC', 'UPS', 'FDX', 'CMG', 'DPZ', 'ELF', 'TGT', 'LOW',
        'ABBV', 'PFE', 'MRK', 'JNJ', 'ZTS', 'REGN', 'ISRG', 'SYK', 'BSX', 'DXCM',
    ]  # you can still list 50+
  period: "2y"
  techs: # pandas-ta names → will be computed on the fly
    sma: 20
    ema: 12
    rsi: 14
    macd: [12,26,9]

paths:
  model: "models/complete_model.pt"

dashboard:
  periods: {"1M":30, "3M":90, "1Y":365}