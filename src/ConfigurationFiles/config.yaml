  # Data paths
  paths:
    stock_data: "Data/stock_data.pt"
    stock_dict: "Data/stock_dict.json"
    train_features: "Data/X_train.pt"
    train_targets: "Data/y_train.pt"
    test_features: "Data/X_test.pt"
    test_targets: "Data/y_test.pt"
  
  # Date ranges
  dates:
    start_date: "2020-01-01"
    end_date: "2025-01-01"
    train_end: "2023-12-31"
  
  # Ticker lists
  tickers:
