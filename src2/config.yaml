# === CONFIG ===
# One location to tweak *everything* (no magic numbers in code).
model:
  seq_len: 30               # how many past days we feed the net
  hidden: 128               # LSTM hidden units
  layers: 3                 # stacked LSTM layers
  dropout: 0.3
  heads: 4                  # multi-head attention
  lr: 1e-3                  # Adam learning-rate

data:
  tickers: ["AAPL", "MSFT", "NVDA", "GOOGL", "META"]  # you can still list 50+
  period: "2y"
  techs: # pandas-ta names → will be computed on the fly
    sma: 20
    ema: 12
    rsi: 14
    macd: [12,26,9]

paths:
  model: "models/complete_model.pt"

dashboard:
  periods: {"1M":30, "3M":90, "1Y":365}